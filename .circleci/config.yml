# Ruby CircleCI 2.0 configuration file
#
# Check https://circleci.com/docs/2.0/language-ruby/ for more details
#
version: 2.1

orbs:
  browser-tools: circleci/browser-tools@1.5.0
  coveralls: coveralls/coveralls@1.0.6
  node: circleci/node@7.1.0

jobs:
  build:
    docker:
      # specify the version you desire here
      - image: cimg/ruby:4.0.5-browsers
      # Specify service dependencies here if necessary
      # CircleCI maintains a library of pre-built images
      # documented at https://circleci.com/docs/2.0/circleci-images/
      # - image: circleci/postgres:9.4
    environment:
      BUNDLE_PATH: vendor/bundle
      BUNDLE_JOBS: 4
      BUNDLE_RETRY: 3
      RAILS_ENV: test
      RACK_ENV: test
      SPEC_OPTS: --profile 10 --format RspecJunitFormatter --out /tmp/test-results/rspec.xml --format progress
      WORKING_PATH: /tmp
      UPLOAD_PATH: /tmp
      CACHE_PATH: /tmp/cache
      COVERALLS_PARALLEL: true

    parallelism: 4
    working_directory: ~/application_portfolio

    steps:
  
      - browser-tools/install-chrome

      - checkout

      - node/install:
          node-version: '26.4.0'

      - run:
          name: Prepare Yarn 4 via Corepack
          command: |
            # cimg images include system Node under /usr/local; node/install adds nvm Node.
            # Do not run `corepack enable` on /usr/local (EACCES); use Corepack from active Node.
            NODE_BIN="$(node -p 'require("path").dirname(process.execPath)')"
            export PATH="${NODE_BIN}:${PATH}"
            echo "export PATH=\"${NODE_BIN}:\${PATH}\"" >> "$BASH_ENV"
            corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
            node -v
            corepack yarn -v

      - restore_cache:
          keys:
            - v2-yarn-4-{{ checksum "yarn.lock" }}
            - v2-yarn-4-

      - run:
          name: Build JavaScript and verify vendored Bootstrap CSS
          command: |
            corepack yarn install --immutable
            corepack yarn build
            test -f app/assets/builds/application.js
            cmp node_modules/bootstrap/dist/css/bootstrap.min.css \
              app/assets/stylesheets/vendor/bootstrap/dist/bootstrap.min.css

      - save_cache:
          paths:
            - node_modules
          key: v2-yarn-4-{{ checksum "yarn.lock" }}

      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "Gemfile.lock" }}
            # fallback to using the latest cache if no exact match is found
            - v1-dependencies-

      - run:
          name: Configure Bundler
          command: |
            BUNDLER_LOCK=$(grep -A 1 "BUNDLED WITH" Gemfile.lock | tail -n 1 | tr -d " ")
            # Use Bundler 2.5.12+ on Ruby 3.4 to avoid Gem::Platform redefinition warnings
            if [ "$BUNDLER_LOCK" = "2.5.11" ]; then BUNDLER_LOCK=2.5.12; fi
            echo "export BUNDLER_VERSION=$BUNDLER_LOCK" >> $BASH_ENV
            source $BASH_ENV
            gem install bundler -v "$BUNDLER_LOCK"

      - run:
          name: Install Dependencies
          command: |
            bundle install --jobs=4 --retry=3 --path vendor/bundle
            sudo apt-get install -y xvfb libfontconfig1
      - save_cache:
          paths:
            - ./vendor/bundle
          key: v1-dependencies-{{ checksum "Gemfile.lock" }}

      # Database setup
      - run: bundle exec rake db:create
      - run: bundle exec rake db:schema:load

      - run:
          name: Compile Dart Sass builds
          command: bundle exec rails dartsass:build

      - run:
          name: Rubocop
          command: |
            gem install rubocop
            bundle exec rubocop

      # Brakeman
      - run:
          name: Run Brakeman
          command: bundle exec brakeman -q -w 2

      # Bundler-audit
      - run:
          name: Install Bundler-audit
          command: gem install bundler-audit
      - run:
          name: Run Bundle-audit
          command: bundle exec bundle audit check --update

      #Rspec
      - run:
          name: Run rspec in parallel
          environment:
            CI: "true"
            CHROME_BIN: /usr/bin/google-chrome
          command: |
            mkdir /tmp/test-results
            bundle exec rspec $(circleci tests glob "spec/**/*_spec.rb" | circleci tests split --split-by=timings)
      # collect reports
      - store_test_results:
          path: /tmp/test-results
      - store_artifacts:
          path: /tmp/test-results
          destination: test-results

      - store_artifacts:
          path: coverage
 
      - coveralls/upload:
          parallel_finished: true
          path_to_lcov: /home/circleci/application_portfolio/coverage/lcov.info

workflows:
    version: 2
    ci:
      jobs:
        - build
