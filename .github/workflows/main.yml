name: CI GitHub Action

on: push

jobs:
  test:
    # ubuntu-22.04: ruby/setup-ruby has 3.4.7; ubuntu-24.04 may not yet
    runs-on: ubuntu-22.04
    services:
      selenium:
        image: selenium/standalone-chrome
        ports:
          - 4444:4444

    steps:
    - uses: actions/checkout@v4

    - name: Set up Ruby
      # Use @v1 so latest action gets new Ruby versions (e.g. 3.4.7)
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.4.7'
        bundler-cache: true

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb libnss3-dev
        gem install bundler
        bundle config set force_ruby_platform true
        bundle install

    - name: Run migrations
      run: |
        bundle exec rails db:migrate RAILS_ENV=test
 
    - name: Run rubocop
      run: |
        bundle exec rubocop

    - name: Run tests
      env:
        DISPLAY: :99.0
      run: |
        Xvfb :99 -ac &
        bundle exec rspec

    - name: Coveralls
      uses: coverallsapp/github-action@v2.3.7

    - name: Brakeman linter
      run: bundle exec brakeman --no-exit-on-warn --no-exit-on-error

    - name: 'Run Bundler Audit'
      run: bundle exec bundler-audit

