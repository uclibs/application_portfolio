name: CI GitHub Action

on: push

jobs:
  test:
    runs-on: ubuntu-22.04

    services:
      selenium:
        image: selenium/standalone-chrome
        ports:
          - 4444:4444

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: yarn

      - name: Enable Yarn
        run: |
          corepack enable
          yarn -v

      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile

      - name: Verify committed JavaScript bundle is current
        run: |
          yarn build
          git diff --exit-code app/assets/builds/application.js app/assets/builds/application.js.map \
            app/assets/builds/application.js.sources.sha256

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.9'
          bundler-cache: true

      - name: Force Ruby platform and install gems
        run: |
          bundle config set --local force_ruby_platform true
          bundle install
        env:
          BUNDLE_FORCE_RUBY_PLATFORM: "1"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3-dev
          # If you build Nokogiri with system libs, add:
          # sudo apt-get install -y build-essential libxml2-dev libxslt1-dev

      - name: Run rubocop
        run: bundle exec rubocop

      - name: Prepare DB
        run: bundle exec rails db:prepare RAILS_ENV=test

      - name: Run tests
        env:
          CI: "true"
          CHROME_BIN: /usr/bin/google-chrome
          DISPLAY: :99.0
        run: |
          Xvfb :99 -ac &
          bundle exec rspec

      - name: Coveralls
        uses: coverallsapp/github-action@v2.3.7

      - name: Brakeman linter
        run: bundle exec brakeman --no-exit-on-warn --no-exit-on-error

      - name: Run Bundler Audit
        run: bundle exec bundler-audit update && bundle exec bundler-audit check
